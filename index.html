<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1ed760;
      color: #000;
      padding: 15px 20px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .station-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .station-card {
      background-color: #181818;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.3s;
      border: 1px solid #282828;
    }
    .station-card:hover {
      background-color: #282828;
    }
    .station-card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .station-card h3 {
      font-size: 1rem;
      color: #fff;
    }
    .player-bar {
      background-color: #181818;
      border-top: 1px solid #282828;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .current-title {
      font-size: 0.9rem;
      color: #b3b3b3;
    }
    audio {
      width: 100%;
      max-width: 500px;
      height: 40px;
    }
    .loading {
      text-align: center;
      margin-top: 50px;
      color: #b3b3b3;
    }
  </style>
</head>
<body>

  <header>
    Emisoras Católica en Vivo
  </header>

  <div class="container">
    <div id="loading" class="loading">Cargando emisoras...</div>
    <div id="stationList" class="station-list"></div>
  </div>

  <div class="player-bar">
    <div id="currentStation" class="current-title">Selecciona una emisora para reproducir</div>
    <audio id="audioPlayer" controls autoplay></audio>
  </div>

  <script>
    window.onload = function() {
      google.script.run.withSuccessHandler(renderStations).getEmisoras();
    };

    function renderStations(emisoras) {
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('stationList');
      container.innerHTML = '';

      if (emisoras.length === 0) {
        container.innerHTML = '<p>No hay emisoras disponibles.</p>';
        return;
      }

      emisoras.forEach(emisora => {
        const card = document.createElement('div');
        card.className = 'station-card';
        card.onclick = () => playStation(emisora.nombre, emisora.url);
        
        card.innerHTML = `
          <img src="${emisora.logo}" alt="${emisora.nombre}" onerror="this.src='https://via.placeholder.com/100?text=Radio'">
          <h3>${emisora.nombre}</h3>
        `;
        
        container.appendChild(card);
      });
    }

    function playStation(nombre, url) {
      const player = document.getElementById('audioPlayer');
      const title = document.getElementById('currentStation');
      
      title.innerText = 'Reproduciendo: ' + nombre;
      player.src = url;
      player.play().catch(error => {
        console.log('Error al reproducir:', error);
      });
    }
  </script>
</body>
</html>
